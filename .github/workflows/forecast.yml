name: Wendy forecast fetch

# GitHub runners have open internet, so the Open-Meteo pull works here even though
# the Claude cloud-routine sandbox blocks it. This job fetches + renders the forecast
# and commits the output; the cloud routine then just reads the committed file and
# sends the calendar invite (no blocked egress on the routine side).

on:
  schedule:
    # Big buffer before the alert routines: GitHub scheduled runs drift by hours,
    # so a 10-min lead let the alert win the race and point at stale data. The
    # routines also self-trigger + poll this workflow if data is still stale.
    - cron: "0 3 * * *"     # daily  03:00 UTC (05:00 Amsterdam) - 2h before the daily routine (05:00 UTC). Also refreshes the surf side.
    - cron: "0 14 * * 0"    # Sunday 14:00 UTC (16:00 Amsterdam) - 2h before the weekly routine (16:00 UTC)
    # Surf trip (France, 14 Sep - 4 Oct 2026): midday refresh of the surf side, 10:00 UTC = 12:00 Paris.
    - cron: "0 10 14-30 9 *"
    - cron: "0 10 1-4 10 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly, daily or surf"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, surf]

permissions:
  contents: write

concurrency:
  group: wendy-forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 14 * * 0") echo "mode=weekly" >> "$GITHUB_OUTPUT";;
              "0 10 "*)     echo "mode=surf"   >> "$GITHUB_OUTPUT";;
              *)            echo "mode=daily"  >> "$GITHUB_OUTPUT";;
            esac
          else
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Copernicus IBI wave forecast (surf side)
        # Free Copernicus Marine account; credentials are repo secrets. Writes data/copernicus.json,
        # which surf.py adds as a 4th wave model. If this step fails surf.py just runs on the 3 Open-Meteo models.
        if: steps.mode.outputs.mode != 'weekly'
        continue-on-error: true
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: |
          pip install -q copernicusmarine
          python3 fetch_copernicus.py data/copernicus.json

      - name: Run forecast engine
        run: |
          mkdir -p data
          MODE="${{ steps.mode.outputs.mode }}"
          echo "Running wendy.py $MODE"
          if [ "$MODE" = "surf" ]; then
            # Surf side only (midday trip refresh): rerun surf.py and rebuild docs/surf.html.
            python3 surf.py > data/surf.out.txt 2>data/surf.err.txt || { echo "surf engine non-zero:"; cat data/surf.err.txt; }
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/surf.fetched_at.txt
            python3 gen_surf_dashboard.py data/surf.out.txt docs/surf.html || echo "surf dashboard gen failed"
            exit 0
          fi
          # Capture the full engine output (human summary + SUBJECT/EMAIL_HTML/JSON blocks).
          python3 wendy.py "$MODE" > "data/$MODE.out.txt" 2>"data/$MODE.err.txt" || {
            echo "engine exited non-zero; err:"; cat "data/$MODE.err.txt";
          }
          # Stamp when this data was produced so the routine can detect staleness.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "data/$MODE.fetched_at.txt"
          echo "=== head of output ==="; head -5 "data/$MODE.out.txt" || true
          # Always refresh the 7-day dashboard so the hosted page stays current on every run.
          if [ "$MODE" != "weekly" ]; then
            python3 wendy.py weekly > "data/weekly.out.txt" 2>"data/weekly.err.txt" || true
            date -u +"%Y-%m-%dT%H:%M:%SZ" > "data/weekly.fetched_at.txt"
          fi
          python3 gen_dashboard.py "data/weekly.out.txt" docs/index.html || echo "dashboard gen failed"
          # Surf side (France trip): refresh on the daily run too so the morning ping has fresh data.
          if [ "$MODE" = "daily" ]; then
            python3 surf.py > data/surf.out.txt 2>data/surf.err.txt || { echo "surf engine non-zero:"; cat data/surf.err.txt; }
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/surf.fetched_at.txt
            python3 gen_surf_dashboard.py data/surf.out.txt docs/surf.html || echo "surf dashboard gen failed"
          fi

      - name: Commit output
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          git config user.name "wendy-bot"
          git config user.email "actions@github.com"
          git add data/ docs/index.html docs/surf.html docs/map.html
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "Wendy: $MODE forecast data $(date -u +%Y-%m-%d)"
          # The cloud routine pushes to the same branch, so rebase-and-retry to avoid races.
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "push failed after retries"; exit 1
